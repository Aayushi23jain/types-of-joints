  var t = document.getElementById('loadText'); if (t) t.textContent = msg || M[0];
  var b = document.getElementById('loadRetry'); if (b) { b.hidden = false; if (!msg) b.textContent = M[1]; }
};
// watchdog: fail only when loading STALLS (no progress for 45 s), not when a slow connection is still downloading

<!-- SwiftPAL Platform Bridge: copied unchanged from the FLN math games (MT01A01_L05_S02/index.html). Declares the bare top-level
     const SwiftPAL used by js/xapi.js (SwiftPAL.sendEvent). Do not edit here; update it from the source when the bridge changes. -->
<script>
/**
 * SwiftPAL Platform Bridge
 * =========================
 * Single dispatcher for all native ↔ JS communication.
 * Injected inline into every activity HTML by render.js (%%SWIFTPAL_BRIDGE%%).
 *
 * PLATFORMS SUPPORTED
 *   android   — window.Android JavascriptInterface
 *   ios       — window.webkit.messageHandlers.swiftpal (WKWebView)
 *   web       — window.parent / window.opener postMessage (iframe / React)
 *   electron  — window.opener postMessage
 *
 * PUBLIC API
 *   SwiftPAL.sendEvent(payload)              → fire-and-forget event (used by EventBus)
 *   SwiftPAL.invoke(name, ...args)           → call any native function by name
 *   SwiftPAL.query(name, timeout, ...args)   → call native, await callback with result
 *   SwiftPAL.platform                        → detected platform string
 *
 * ANDROID CALLBACK PATTERN (for query())
 *   Android receives resolverId as last arg, then calls back:
 *     webView.evaluateJavascript(
 *       "window.__swiftpalResolvers['RESOLVER_ID'] && " +
 *       "window.__swiftpalResolvers['RESOLVER_ID']('" + result + "')", null
 *     );
 *   Each call gets a unique resolverId so parallel queries never collide.
 */
const SwiftPAL = (function () {

  /* ── Platform detection ── */
  const PLATFORM =
    (window.Android && typeof window.Android.sendEvent === 'function') ? 'android' :
    (window.webkit?.messageHandlers?.swiftpal)                         ? 'ios'     :
    (window.parent !== window)                                          ? 'web'     :
    (window.opener)                                                     ? 'electron':
                                                                          'web';

  /* ── Resolver map for query() callbacks ──
     Keyed by unique resolverId so parallel in-flight queries never collide.
     Android (or any native side) resolves a specific Promise by calling:
       window.__swiftpalResolvers['<id>']('<result>')                       */
  window.__swiftpalResolvers = window.__swiftpalResolvers || {};

  /* ═══════════════════════════════════════════════════════════════
     CORE DISPATCHER
     Routes a function call to the correct native channel.
     name  = method name on the native side
     args  = arguments to forward
     ═══════════════════════════════════════════════════════════════ */
  function _call(name, args) {
    try {
      switch (PLATFORM) {

        case 'android':
          /* JavascriptInterface — each method called by name directly.
             All args are forwarded; for sendEvent the payload is already
             a JSON string at this point.                                  */
          if (window.Android && typeof window.Android[name] === 'function') {
            window.Android[name](...args);
          } else {
            console.warn(`[SwiftPAL Bridge] Android.${name} not found`);
          }
          break;

        case 'ios':
          /* WKWebView messageHandlers — wraps name + args into one object */
          window.webkit.messageHandlers.swiftpal.postMessage({ fn: name, args });
          break;

        case 'android':   /* already handled above — unreachable but explicit */
          break;

        case 'web':
        case 'electron':
        default:
          /* iframe / React web / Electron — postMessage to parent or opener */
          const target = window.parent !== window ? window.parent
                       : window.opener             ? window.opener
                       : null;
          if (target) {
            target.postMessage({ source: 'swiftpal', fn: name, args }, '*');
          }
          break;
      }
    } catch (e) {
      console.warn(`[SwiftPAL Bridge] _call error for ${name}:`, e);
    }

    /* Always fire a local CustomEvent regardless of platform —
       lets in-page analytics / debug tools observe every call  */
    try {
      window.dispatchEvent(new CustomEvent(`swiftpal:${name}`, {
        detail: { fn: name, args }
      }));
    } catch (e) { /* ignore */ }

    console.log(`[SwiftPAL Bridge] ${PLATFORM}.${name}`, ...args);
  }

  /* ═══════════════════════════════════════════════════════════════
     PUBLIC API
     ═══════════════════════════════════════════════════════════════ */
  return {

    /** Detected platform — 'android' | 'ios' | 'web' | 'electron' */
    platform: PLATFORM,

    /**
     * sendEvent(payload)
     * Fire-and-forget — used by EventBus for all xAPI events.
     * payload is serialised to JSON before dispatch.
     */
    sendEvent(payload) {
      _call('sendEvent', [JSON.stringify(payload)]);
    },

    /**
     * invoke(name, ...args)
     * Generic fire-and-forget call to any native function by name.
     * e.g. SwiftPAL.invoke('logError', 'Something went wrong')
     */
    invoke(name, ...args) {
      _call(name, args);
    },

    /**
     * query(name, timeout = 5000, ...args)
     * Call a native function and await its async response.
     * Each call gets a unique resolverId so parallel calls never collide.
     *
     * ANDROID IMPLEMENTATION:
     *   @JavascriptInterface
     *   fun getProgress(resolverId: String) {
     *     val result = ...compute...
     *     webView.post {
     *       webView.evaluateJavascript(
     *         "window.__swiftpalResolvers['$resolverId'] && " +
     *         "window.__swiftpalResolvers['$resolverId']('$result')", null
     *       )
     *     }
     *   }
     *
     * JS USAGE:
     *   const progress = await SwiftPAL.query('getProgress');
     *   const [prog, uid] = await Promise.all([
     *     SwiftPAL.query('getProgress'),
     *     SwiftPAL.query('getUserId'),
     *   ]);
     */
    query(name, timeout = 5000, ...args) {
      return new Promise((resolve, reject) => {
        /* Unique id — timestamp + random suffix prevents collision
           even when the same function is queried in parallel        */
        const id = `${name}_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;

        /* Register resolver — Android calls back with this id */
        window.__swiftpalResolvers[id] = (result) => {
          clearTimeout(timer);
          delete window.__swiftpalResolvers[id];
          resolve(result);
        };

        /* Timeout guard — prevents hanging Promises if native never responds */
        const timer = setTimeout(() => {
          if (window.__swiftpalResolvers[id]) {
            delete window.__swiftpalResolvers[id];
            reject(new Error(`[SwiftPAL Bridge] query('${name}') timed out after ${timeout}ms`));
          }
        }, timeout);

        /* Forward call with resolverId appended as last arg */
        _call(name, [...args, id]);
      });
    }

  };

})();

</script>
